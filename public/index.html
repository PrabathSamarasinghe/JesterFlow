<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simple Calculator</h1>
        <form id="calculatorForm">
            <div class="input-group">
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1" placeholder="Enter first number">
            </div>
            <div class="input-group">
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2" placeholder="Enter second number">
            </div>
            <div class="input-group">
                <label for="operation">Operation:</label>
                <select id="operation" name="operation">
                    <option value="">Select an operation</option>
                    <option value="add">Add (+)</option>
                    <option value="subtract">Subtract (-)</option>
                    <option value="multiply">Multiply (*)</option>
                    <option value="divide">Divide (/)</option>
                </select>
            </div>
            <button type="submit" id="calculateBtn">Calculate</button>
        </form>

        <div id="result" class="result" style="display: none;">
            <p>Result: <span id="resultValue">0</span></p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p id="errorMessage">Error occurred</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
