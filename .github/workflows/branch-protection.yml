name: Configure Branch Protection

on:
  workflow_dispatch:

jobs:
  configure-protection:
    name: Configure Branch Protection Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Configure Main Branch Protection
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: ['Unit Tests', 'Integration Tests']
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              allow_force_pushes: false,
              allow_deletions: false,
              required_linear_history: true
            }).catch(err => {
              if (err.status === 422) {
                console.log('Main branch protection already configured or error:', err.message);
              } else {
                throw err;
              }
            });

      - name: Configure Development Branch Protection
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'development',
              required_status_checks: {
                strict: true,
                contexts: ['Unit Tests', 'Integration Tests']
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              allow_force_pushes: false,
              allow_deletions: false,
              required_linear_history: false
            }).catch(err => {
              if (err.status === 422) {
                console.log('Development branch protection already configured or error:', err.message);
              } else {
                throw err;
              }
            });

      - name: Print Configuration Summary
        run: |
          echo "✅ Branch Protection Rules Configured"
          echo ""
          echo "🔒 Main Branch:"
          echo "  - Requires PR reviews (1 approval)"
          echo "  - Requires status checks (passing tests)"
          echo "  - Enforce admins: Yes"
          echo "  - Force pushes: Disabled"
          echo "  - Deletions: Disabled"
          echo "  - Linear history: Required"
          echo ""
          echo "🔒 Development Branch:"
          echo "  - Requires PR reviews (1 approval)"
          echo "  - Requires status checks (passing tests)"
          echo "  - Enforce admins: Yes"
          echo "  - Force pushes: Disabled"
          echo "  - Deletions: Disabled"
