name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches:
      - main
      - development
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  # ============================================================================
  # TESTING JOBS - Run on all pushes and pull requests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # ============================================================================
  # DEPLOYMENT TO DEVELOPMENT - On approved PR to development
  # ============================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: integration-tests
    if: |
      github.event_name == 'pull_request_review' && 
      github.event.review.state == 'approved' && 
      github.event.pull_request.base.ref == 'development'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Deploy to Development Environment
        run: echo "Deploying to development environment..."

  # ============================================================================
  # DEPLOYMENT TO PRODUCTION - Manual trigger via workflow_dispatch
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Deploy to Production Environment
        run: echo "Deploying to production environment..."

  # ============================================================================
  # CLEANUP - Delete feature branches after merge to development
  # ============================================================================
  cleanup-feature-branch:
    name: Cleanup Feature Branch
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/development' &&
      startsWith(github.head_ref, 'feature/')

    steps:
      - name: Delete feature branch
        uses: dawidd6/action-delete-branch@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branches: ${{ github.head_ref }}
