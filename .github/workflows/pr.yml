name: Main Release Pipeline

on:
  pull_request:
    branches:
      - main
      - development
  
  pull_request_review:
    types: [submitted]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'development'

    steps:
      - name: Deploy to Development Environment
        run: echo "Deploying to development environment..." # Replace with actual deployment commands
  