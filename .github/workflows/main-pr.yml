name: Main Release Pipeline

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_prod:
        description: "Deploy to production?"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to dev
        run: echo "Deploying to dev"

  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prod == 'yes'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploying to production"